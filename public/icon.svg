<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B18" />
      <stop offset="100%" stop-color="#0A1222" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9B5" />
      <stop offset="100%" stop-color="#00C8FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Inner glowing emblem -->
  <rect x="96" y="96" width="320" height="320" rx="72" fill="url(#accentGrad)" filter="url(#glow)" />

  <!-- Stylized AF Monogram & Pulse -->
  <text x="256" y="295" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif" font-size="160" font-weight="900" fill="#050B18" text-anchor="middle" letter-spacing="-6">
    AF
  </text>
  <path d="M 176 348 L 220 348 L 236 324 L 256 372 L 276 332 L 292 348 L 336 348" fill="none" stroke="#050B18" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
</svg>
